name: Build & Release piDroid APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号 (例如 v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK with Global Keystore
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ***REMOVED-ROTATED-PASSWORD***
          KEY_ALIAS: pidroid
          KEY_PASSWORD: ***REMOVED-ROTATED-PASSWORD***
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          
          # 寻找构建出的 release apk
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_NAME="piDroid-${VERSION}.apk"
          
          cp "$APK_PATH" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.version }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: "piDroid ${{ steps.prepare_apk.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          body: |
            ### 🚀 piDroid 官方正式首发版本 ${{ steps.prepare_apk.outputs.version }}

            #### 🌟 核心特性升级：
            - **✨ CommonMark + GFM 富文本引擎**：完整支持 Markdown 表格横向滚动、CJK 中英文排版、代码块语法高亮与 LaTeX 渲染；
            - **🎨 Termius 工业级双模自适应主题**：默认浅色纯白明眸与极客暗黑自由切换，全界面容器自适应，消除多余黑框与布局混乱；
            - **⚡ 多镜像竞速更新体系**：内置官方与加速镜像（ghfast 等）自适应测速与断流重连，系统设置中心一键检查升级与安装；
            - **🔄 全栈式实时长连接同步**：两阶段历史会话毫秒级 Catch-up 与 SSE 实时打字机事件流同步，保持与 Web 端绝对一致；
            - **🛠️ 权威系统设置中心**：侧边工作区抽屉切换、模型及推理级别动态切换、技能/MCP 全局管控与后台保活偏好；
            - **🔑 全局统一签名保障**：固化全局正式签名，后续升级全流程无缝覆盖安装，配置与数据零丢失。

            #### 📦 下载与安装：
            直接下载下方附件中的 `${{ steps.prepare_apk.outputs.apk_path }}` 并在安卓设备上安装使用！
