name: Build & Release piDroid APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号 (例如 v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: |
          chmod +x gradlew || true
          chmod +x android/gradlew || true

      - name: Build Release APK with Global Keystore
        env:
          KEYSTORE_PASSWORD: ***REMOVED-ROTATED-PASSWORD***
          KEY_ALIAS: pidroid
          KEY_PASSWORD: ***REMOVED-ROTATED-PASSWORD***
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            cd android && ./gradlew assembleRelease --stacktrace
          fi

      - name: Prepare APK Artifact
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          
          # 寻找构建出的 release apk (兼容根目录 app/build 和 android/app/build)
          APK_PATH=$(find . -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          TARGET_NAME="piDroid-${VERSION}.apk"
          
          cp "$APK_PATH" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.version }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: "piDroid ${{ steps.prepare_apk.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          body: |
            ### 🚀 piDroid 官方正式发布版本 ${{ steps.prepare_apk.outputs.version }}

            #### 🌟 核心特性升级：
            - **✨ 多媒体内容与图片预览**：全新集成多媒体附件流式渲染与预览支持；
            - **🛠️ 自定义工作区与模型扩展**：支持自定义 API 端点与工作区技能配置覆盖；
            - **💬 对话界面输入重构**：优化输入框与模型推理级别动态切换体验；
            - **🎨 Termius 工业级双模自适应主题**：默认纯白明眸与极客暗黑自由切换，全界面容器自适应；
            - **⚡ 多镜像竞速更新体系**：内置官方与加速镜像（ghfast 等）自适应测速与断流重连；
            - **🔄 全栈式实时长连接同步**：两阶段历史会话毫秒级 Catch-up 与 SSE 实时打字机事件流同步；
            - **🔑 全局统一签名保障**：固化全局正式签名，全版本无缝覆盖安装，配置与数据零丢失。

            #### 📦 下载与安装：
            直接下载下方附件中的 `${{ steps.prepare_apk.outputs.apk_path }}` 并在安卓设备上安装使用！
