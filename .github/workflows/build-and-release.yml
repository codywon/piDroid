name: Build & Release piDroid APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号 (例如 v1.5.1)'
        required: true
        default: 'v1.5.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: |
          chmod +x gradlew || true
          chmod +x android/gradlew || true

      - name: Build Release APK with Global Keystore
        env:
          KEYSTORE_PASSWORD: ***REMOVED-ROTATED-PASSWORD***
          KEY_ALIAS: pidroid
          KEY_PASSWORD: ***REMOVED-ROTATED-PASSWORD***
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            cd android && ./gradlew assembleRelease --stacktrace
          fi

      - name: Prepare APK Artifact
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          
          # 寻找构建出的 release apk (兼容根目录 app/build 和 android/app/build)
          APK_PATH=$(find . -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          TARGET_NAME="piDroid-${VERSION}.apk"
          
          cp "$APK_PATH" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.version }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version }}"
          CLEAN_VERSION="${VERSION#v}"
          NOTES_FILE="release_body.md"
          
          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="$CLEAN_VERSION" '
              BEGIN { in_ver = 0 }
              $0 ~ "^## \\[" ver "\\]" { in_ver = 1; next }
              in_ver && $0 ~ "^## \\[" { in_ver = 0 }
              in_ver { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          
          if [ ! -s "$NOTES_FILE" ]; then
            echo "### 🚀 piDroid 官方正式发布版本 ${VERSION}" > "$NOTES_FILE"
            echo "- 修复已知问题并提升稳定性" >> "$NOTES_FILE"
          fi
          
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: "piDroid ${{ steps.prepare_apk.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
