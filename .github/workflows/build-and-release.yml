name: Build & Release πDroid APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号 (例如 v1.5.1)'
        required: true
        default: 'v1.5.1'

permissions:
  contents: write

# 同一 tag 的重复触发串行执行，避免两次 release 抢同一个 asset 名
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 版本号只有一个真源：app/build.gradle.kts 的 versionName。tag 只用来命名 Release 与
      # 决定「有没有新版本」（AppUpdateManager 拿 APK 的 versionName 和 Release 的 tag_name 比）。
      # 两者一旦漂移，后果是**持久**的：Release 叫 vX.Y.Z，APK 里的 versionName 却是旧值，
      # 用户装完仍被判为「有新版本」，更新提示永远消不掉。这里在构建前先对齐，几秒就能红。
      - name: Verify tag matches versionName and CHANGELOG
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          CLEAN="${VERSION#v}"
          GRADLE_VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ "$CLEAN" != "$GRADLE_VERSION" ]]; then
            echo "::error::Tag/input 是 ${VERSION}，但 app/build.gradle.kts 的 versionName 是 '${GRADLE_VERSION}'；按发版 SOP 先改版本号再打 tag。"
            exit 1
          fi
          if [[ ! -f CHANGELOG.md ]] || ! grep -qF "## [${CLEAN}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 '## [${CLEAN}] - YYYY-MM-DD' 段落：Release notes 会静默回退成默认文案。"
            exit 1
          fi
          echo "OK: ${VERSION} 与 versionName / CHANGELOG 一致"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # cache-provider 必须显式设为 basic：
      # 默认的 enhanced 是 gradle-actions-caching 商业预览服务，本项目上恢复缓存时
      # 返回 "Cache service responded with 400"（每次发的都是红色注解）。
      # basic 走标准 actions/cache 后端，公共/私有仓库均免费且稳定。
      - name: Setup Gradle (basic cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # tag 构建默认会被判定为「非默认分支」而只读不写，这里显式允许写回，
          # 否则每次发版都要重新下载全部依赖。
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret KEYSTORE_BASE64. Release signing cannot proceed."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      # 轮换护栏（2026-11-01）：旧 release keystore 的私钥曾进入公开仓库历史，
      # 且与 1.7.x 正式包签名一致 —— 视为已泄露。宁可让流水线红掉，
      # 也不能再用它签出任何包。
      - name: Refuse the compromised keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore keystore/release.jks \
                 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
               | sed -n 's/.*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ' ')
          echo "keystore SHA-256 = ${FP:-<unparsed>}"
          # 失败即关闭：解析不出指纹（密码错、keytool 失败、输出格式变了）时不能当"不是泄露那把"放行，
          # 否则这道护栏会在没有任何人知情的情况下静默失效。
          if [ -z "${FP:-}" ]; then
            echo "::error::Could not read the keystore SHA-256 (wrong password or unexpected keytool output); refusing to sign blind."
            exit 1
          fi
          LEAKED="07B41E748BB9854A13F53338BC575DAF22A802727944158DE26BBD9C860A70C7"
          FP_NORM=$(echo "$FP" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$FP_NORM" = "$(echo "$LEAKED" | tr -d ': ' | tr 'A-F' 'a-f')" ]; then
            echo "::error::Refusing to sign with the compromised keystore (leaked to a public repository)."
            exit 1
          fi

      # 裸色守卫：配色体系已全部收敛到 ThemePalette（见 docs/DESIGN-color-tokens.md）。
      # 本机不能编译，全靠这里兜住「新代码又写死 Color(0x...)」的回潮。
      # 唯一白名单是主题定义层 —— 把颜色翻译成 Token 的地方本来就要写原始值；
      # 业务组件（含沉浸层、图表色）的数值都已下沉到 ThemePalette，因此不应再有例外。
      - name: Guard hardcoded colors
        run: |
          set -e
          raw=$(git grep -nE "Color\(0x[0-9A-Fa-f]{6,8}\)" -- app/src/main/java || true)
          hits=$(echo "$raw" | grep -v "com/pi/app/ui/theme/" | grep -F ".kt:" || true)
          if [ -n "$hits" ]; then
            echo "::error::业务组件里出现裸色值，请改用 ThemePalette / AppTheme Token（见 docs/DESIGN-color-tokens.md）"
            echo "$hits"
            exit 1
          fi
          echo "OK: 业务组件无裸色值"

      # 单测门禁：解析与流式提取这类纯 JVM 逻辑一旦回归，宁可不发版也不能把已知坏掉的构建推给用户。
      # 放在签名/打包之前，失败即中断，不浪费一次 release。
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)."
            exit 1
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        id: prepare_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi

          APK_PATH=$(find ./app/build -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          # APK 资产名保持 ASCII slug：下载走 GitHub / 国内镜像的 URL path，
          # 非 ASCII 文件名会被二次编码，部分镜像站会 404。展示名在 Release 标题里。
          TARGET_NAME="piDroid-${VERSION}.apk"

          cp "$APK_PATH" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 发布 checksums.txt 供应用内更新做完整性校验
          sha256sum "$TARGET_NAME" > checksums.txt
          echo "checksums=checksums.txt" >> $GITHUB_OUTPUT

      - name: Upload Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare_apk.outputs.version }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          # 重跑同一个版本号时覆盖，而不是让 workflow 因同名 artifact 直接失败
          overwrite: true

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version }}"
          CLEAN_VERSION="${VERSION#v}"
          NOTES_FILE="release_body.md"

          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="$CLEAN_VERSION" '
              BEGIN { in_ver = 0 }
              index($0, "## [" ver "]") == 1 { in_ver = 1; next }
              in_ver && index($0, "## [") == 1 { in_ver = 0 }
              in_ver { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            echo "### 🚀 πDroid 官方正式发布版本 ${VERSION}" > "$NOTES_FILE"
            echo "- 修复已知问题并提升稳定性" >> "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version }}
          name: "πDroid ${{ steps.prepare_apk.outputs.version }}"
          draft: false
          prerelease: false
          # 2.0.0 起 Releases 历史已清空（不再保留 1.x 的 tag），自动生成对比日志
          # 没有基线可用、只会在 body 里多加一段无意义的 Full Changelog。
          # 说明文本统一以 CHANGELOG.md 为准，这里关掉以免首次发布多一个失败面。
          generate_release_notes: false
          # 重跑发布时覆盖 assets，避免 "already_exists" 失败
          overwrite_files: true
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.checksums }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
